<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Seguimiento del pedido · Taquería El Comal</title>
  <link rel="stylesheet" href="/admin/panel.css">
  <link rel="stylesheet" href="/seguimiento/seguimiento.css">
  <script src="/negocio.js" defer></script>
  <script src="/seguimiento/memoria.js" defer></script>
  <script src="/seguimiento/seguimiento.js" defer></script>
</head>
<body data-titulo-pagina="Seguimiento del pedido">
  <main>
    <p><a href="/#menu">Volver al menú</a></p>
    <h1>Seguimiento del pedido</h1>
    <p><span data-nombre-negocio>Taquería El Comal</span> · Demostración</p>
    <section class="pedido-cocina" aria-label="Estado del pedido de prueba">
      <h2 id="folio-seguimiento" hidden></h2>
      <p id="estado-seguimiento" role="status">Consultando el pedido…</p>
      <p id="cobro-seguimiento" role="status" hidden></p>
      <p id="fecha-seguimiento" hidden></p>
    </section>
    <details id="detalle-seguimiento" hidden>
      <summary>Ver detalle del pedido</summary>
      <p id="servicio-seguimiento"></p>
      <ul id="productos-seguimiento"></ul>
      <p id="notas-seguimiento" hidden></p>
      <dl id="importes-seguimiento"></dl>
    </details>
    <button id="actualizar-seguimiento" type="button" hidden>Actualizar estado</button>
  </main>
</body>
</html>
