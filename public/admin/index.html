<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel del encargado · Taquería El Comal</title>
  <link rel="stylesheet" href="/admin/panel.css">
  <script src="/admin/panel.js" defer></script>
</head>
<body>
  <main>
    <h1>Panel del encargado</h1>
    <p>Taquería El Comal</p>
    <p id="mensaje" role="status"></p>

    <form id="acceso" hidden>
      <label for="clave">Contraseña del encargado</label>
      <input id="clave" type="password" autocomplete="current-password" required maxlength="256">
      <label class="recordar">
        <input id="recordar" type="checkbox">
        Recordarme por 7 días
      </label>
      <button type="submit">Entrar</button>
    </form>

    <section id="panel" hidden>
      <details id="agenda">
        <summary>Agenda de mesas</summary>
        <p>Registra una mesa después de confirmar la solicitud por WhatsApp.</p>
        <form id="formulario-agenda">
          <label for="agenda-fecha">Fecha</label>
          <input id="agenda-fecha" type="date" required>
          <label for="agenda-hora">Hora de inicio</label>
          <input id="agenda-hora" type="time" required>
          <label for="agenda-personas">Número de personas</label>
          <input id="agenda-personas" type="number" min="1" step="1" required>
          <button type="submit">Registrar mesa</button>
        </form>
        <p id="agenda-estado" role="status"></p>
        <div id="agenda-mesas"></div>
      </details>
      <p>Marca un producto como agotado cuando se termine. Puedes volver a activarlo desde aquí.</p>
      <div id="productos"></div>
      <button id="salir" type="button">Cerrar sesión</button>
    </section>
  </main>
</body>
</html>
