
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Taquería El Comal</title>

  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>

<body>

<header>
  <!-- Acceso al carrito -->
  <button
    id="abrir-carrito"
    type="button"
    aria-label="Ver carrito de compras"
    aria-controls="carrito"
    aria-expanded="false"
  >
    🛒 <span id="carrito-contador">0</span>
  </button>

  <p class="subtitulo">SABOR DE MÉXICO</p>

    <h1>TAQUERÍA EL COMAL</h1>
    <p>Tacos preparados al momento</p>
    <a href="#menu" class="boton">Explorar menú</a>
  </header>

  <main>
    <section id="menu">
      <h2>Nuestro menú</h2>
      <p>Elige tus favoritos</p>
      
<!-- Navegación por categorías -->
<nav id="categorias" aria-label="Categorías del menú"></nav>
      
      <div id="productos">
        <p>Cargando productos...</p>
      </div>

      
<!-- Carrito de compras -->
<section id="carrito">
  <h2>Tu pedido</h2>

  <div id="carrito-productos">
    <p>Tu carrito está vacío.</p>
  </div>

  <div class="carrito-resumen">
    <strong>Total:</strong>
    <strong id="carrito-total">$0.00</strong>
  </div>

  <button id="vaciar-carrito" type="button">
  Vaciar carrito
</button>
  
</section>

      
    </section>
  </main>

  <footer>
    <p>Taquería El Comal — Página de demostración</p>
  </footer>
</body>
</html>
