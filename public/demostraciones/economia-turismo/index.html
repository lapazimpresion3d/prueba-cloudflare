<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Economía turística | Bahía Tours</title><link rel="stylesheet" href="../salidas/agenda.css"><link rel="stylesheet" href="../abordaje/abordaje.css"><script type="module" src="./app.mjs"></script></head><body><main><a id="volver">← Reservaciones</a><h1>Administración económica turística</h1><p>Modo demostración · MXN · sin cobros ni devoluciones reales.</p><p id="aviso" role="status"></p><div id="contenido" hidden><section><h2>Registrar movimiento</h2><form id="movimiento"><label>Reservación<select name="id" required></select></label><label>Tipo<select name="tipo"><option value="pago">Anticipo o liquidación</option><option value="devolucion">Devolución</option></select></label><label>Importe MXN<input name="importe" type="number" min="0.01" step="0.01" required></label><label>Método<select name="metodo"><option>efectivo</option><option>transferencia</option><option>tarjeta</option></select></label><label>Referencia ficticia<input name="referencia" placeholder="DEMO-001" pattern="DEMO-[A-Z0-9-]{1,32}" required></label><button>Registrar</button></form></section><section><h2>Reservaciones y movimientos</h2><div id="registros"></div></section><section><h2>Conciliación y ventas</h2><label>Fecha (salida en ventas; movimiento en caja)<input type="date" id="fecha"></label><h3>Caja por método</h3><div id="caja"></div><h3>Ventas y pasajeros por salida</h3><div id="salidas"></div></section></div></main></body></html>
