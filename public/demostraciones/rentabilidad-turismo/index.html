<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rentabilidad | Bahía Tours</title><link rel="stylesheet" href="../abordaje/abordaje.css"><script type="module" src="./app.mjs"></script></head><body><main><a id="volver">← Economía turística</a><h1>Rentabilidad y comisiones</h1><p>Práctica P4. Costos estimados, no contabilidad fiscal. No duplicar gastos de caja. Punto de equilibrio: adultos a tarifa directa, sin comisiones.</p><p id="aviso" role="status"></p><div id="contenido" hidden><section><h2>Costos por salida</h2><form id="costos"><label>Experiencia<select name="experiencia"></select></label><label>Fecha<input name="fecha" type="date" required></label><div id="categorias"></div><label>Costo variable por pasajero MXN<input name="variable" type="number" min="0" step=".01" value="0" required></label><button>Guardar estimación</button></form></section><section><h2>Comisiones de intermediarios</h2><form id="comision"><label>Reservación<select name="reserva"></select></label><label>Canal<select name="canal"><option>directo</option><option>hotel</option><option>agencia</option><option>intermediario</option></select></label><label>Comisión %<input name="porcentaje" type="number" min="0" max="100" step=".01" value="0" required></label><button>Guardar comisión estimada</button></form></section><section><h2>Rentabilidad por salida</h2><div id="reporte"></div></section></div></main></body></html>
