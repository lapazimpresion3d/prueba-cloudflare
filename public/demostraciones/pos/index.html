<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Punto de venta · práctica</title><link rel="stylesheet" href="../estilos.css"><link rel="stylesheet" href="./pos.css"><script type="module" src="./pos.mjs"></script></head><body><header class="barra"><a id="volver" href="../">← Panel de empresa</a><span>POS · DEMOSTRACIÓN</span></header><main><h1 id="titulo">Punto de venta</h1><p>Ventas ficticias de mostrador. No registra dinero real ni envía pedidos a cocina. No introduzcas datos personales.</p><p id="aviso" role="status"></p><div id="contenido" hidden><div class="pos-contexto"><label>Sucursal<select id="sucursal"></select></label><label>Empleado ficticio<select id="empleado"></select></label><label>Cliente opcional<select id="cliente"></select></label></div><div class="pos-layout"><section><h2>Catálogo</h2><div class="pos-contexto"><label>Buscar<input id="buscar" type="search"></label><label>Categoría<select id="categoria"></select></label></div><div id="productos" class="pos-productos"></div></section><section class="pos-carrito"><h2>Venta actual</h2><div id="lineas"></div><label>Descuento (%)<input id="descuento" type="number" min="0" max="100" step="1" value="0"></label><p>Subtotal <strong id="subtotal"></strong></p><p>Descuento <strong id="rebaja"></strong></p><p class="pos-total">Total <strong id="total"></strong></p><label>Método<select id="metodo"></select></label><label>Importe recibido (MXN)<input id="recibido" inputmode="decimal"></label><label id="campo-folio">Folio ficticio<select id="referencia"></select></label><p id="cambio"></p><button id="cobrar" type="button">Confirmar venta simulada</button><button id="vaciar" type="button">Vaciar venta</button></section></div><section><h2>Historial de esta sucursal</h2><div id="historial"></div></section><section id="ticket" hidden><h2>Ticket de práctica</h2><pre id="ticket-texto"></pre><button id="imprimir" type="button">Imprimir ticket</button></section></div></main></body></html>
