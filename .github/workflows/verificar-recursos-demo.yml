name: Verificar recursos de publicación comercial
on:
  workflow_dispatch:
  push:
    branches: [desarrollo]
    paths:
      - 'public/imagenes/demo-*.webp'
permissions:
  contents: read
jobs:
  recursos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verificar-recursos-demo.mjs
