name: Aceptación financiera demo
on:
  push:
    branches: [desarrollo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/aceptacion_financiera.py
      - run: node --test tests/*.test.mjs
